pdf-engine: xelatex
to: beamer
slide-level: 2
metadata:
  theme: Madrid
  colortheme: whale
  fontsize: 11pt
  classoption:
    - t
  CJKmainfont: __CJK_MAIN__
  CJKsansfont: __CJK_SANS__
  CJKmonofont: __CJK_SANS__
variables:
  aspectratio: "169"
include-in-header:
  - __PANDOC_DIR__/defaults/beamer-footline.tex

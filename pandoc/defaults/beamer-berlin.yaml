pdf-engine: xelatex
to: beamer
slide-level: 2
include-in-header:
  - __PANDOC_DIR__/defaults/beamer-color.tex
  - __PANDOC_DIR__/defaults/beamer-footline.tex
metadata:
  theme: Berlin
  colortheme: whale
  fontsize: 11pt
  CJKmainfont: __CJK_MAIN__
  CJKsansfont: __CJK_SANS__
  CJKmonofont: __CJK_SANS__
variables:
  aspectratio: "169"

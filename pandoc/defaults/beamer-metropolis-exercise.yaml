pdf-engine: xelatex
to: beamer
slide-level: 1
include-in-header:
  - __PANDOC_DIR__/defaults/beamer-exercise-style.tex
metadata:
  theme: metropolis
  colortheme: metropolis
  fontsize: 8pt
  CJKmainfont: __CJK_MAIN__
  CJKsansfont: __CJK_SANS__
  CJKmonofont: __CJK_SANS__
  classoption:
    - t
variables:
  aspectratio: "169"
